apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexusforge
  namespace: nexusforge
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - nexusforge.example.com
      secretName: nexusforge-tls
  rules:
    - host: nexusforge.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webapp
                port:
                  number: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: webapp
  namespace: nexusforge
spec:
  selector:
    app: webapp
  ports:
    - port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: nexusforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
        - name: webapp
          image: nexusforge/webapp:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: https://nexusforge.example.com/api
