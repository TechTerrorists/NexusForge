apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: nexusforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: nexusforge/api:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql+asyncpg://$(DB_USER):$(DB_PASSWORD)@postgres:5432/nexusforge
            - name: DATABASE_URL_SYNC
              value: postgresql://$(DB_USER):$(DB_PASSWORD)@postgres:5432/nexusforge
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: nexusforge-secrets
                  key: secret-key
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: nexusforge-secrets
                  key: db-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: nexusforge-secrets
                  key: db-password
            - name: ENVIRONMENT
              value: production
          readinessProbe:
            httpGet:
              path: /api/v1/metrics/health/ready
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/metrics/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: nexusforge
spec:
  selector:
    app: api
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: nexusforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
